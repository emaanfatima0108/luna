<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Product — LUNA</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo">

            LUNA

        </a>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="shop.html">
                Shop
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>


        <div class="nav-actions">

            <a href="cart.html">

                Bag
                <span id="cart-count">
                    0
                </span>

            </a>

        </div>

    </header>



    <!-- PRODUCT -->

    <main>

        <section class="product-details">


            <!-- IMAGE -->

            <div class="product-details-image">

                <img
                    id="product-image"
                    src=""
                    alt="Product">

            </div>



            <!-- INFORMATION -->

            <div class="product-details-info">

                <p
                    id="product-category"
                    class="product-category">
                </p>


                <h1 id="product-name">
                </h1>


                <p
                    id="product-price"
                    class="details-price">
                </p>


                <p
                    id="product-description"
                    class="product-description">
                </p>



                <!-- QUANTITY -->

                <div class="quantity-section">

                    <p>
                        Quantity
                    </p>


                    <div class="quantity-control">

                        <button id="minus">
                            −
                        </button>

                        <span id="quantity">
                            1
                        </span>

                        <button id="plus">
                            +
                        </button>

                    </div>

                </div>



                <!-- BUTTONS -->

                <div class="product-buttons">

                    <button
                        id="add-cart"
                        class="details-cart">

                        Add to Bag

                    </button>


                    <button
                        id="add-wishlist"
                        class="details-wishlist">

                        ♡

                    </button>

                </div>



                <!-- EXTRA INFORMATION -->

                <div class="product-extra">

                    <div>

                        <span>
                            Shipping
                        </span>

                        <p>
                            Free shipping on orders over $100.
                        </p>

                    </div>


                    <div>

                        <span>
                            Returns
                        </span>

                        <p>
                            Easy 14-day returns.
                        </p>

                    </div>


                    <div>

                        <span>
                            Materials
                        </span>

                        <p>
                            Carefully selected premium materials.
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            LUNA
        </div>

        <p>
            Modern essentials, made for you.
        </p>

        <p>
            © 2026 LUNA. All rights reserved.
        </p>

    </footer>



   <script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/product.js"></script>

</body>

</html>
