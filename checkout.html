<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Checkout — LUNA</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo">

            LUNA

        </a>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="shop.html">
                Shop
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>


        <div class="nav-actions">

            <a href="cart.html">
                ← Back to Bag
            </a>

        </div>

    </header>



    <!-- CHECKOUT -->

    <main class="checkout-page">


        <div class="checkout-heading">

            <p>
                LUNA CHECKOUT
            </p>

            <h1>
                Complete Your Order
            </h1>

        </div>



        <div class="checkout-layout">


            <!-- FORM -->

            <section class="checkout-form">

                <form id="checkout-form">


                    <!-- CONTACT -->

                    <div class="checkout-section">

                        <h2>
                            Contact Information
                        </h2>


                        <div class="form-group">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="you@example.com"
                                required>

                        </div>

                    </div>



                    <!-- SHIPPING -->

                    <div class="checkout-section">

                        <h2>
                            Shipping Address
                        </h2>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="first-name">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    id="first-name"
                                    required>

                            </div>


                            <div class="form-group">

                                <label for="last-name">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    id="last-name"
                                    required>

                            </div>

                        </div>


                        <div class="form-group">

                            <label for="address">
                                Address
                            </label>

                            <input
                                type="text"
                                id="address"
                                placeholder="Street address"
                                required>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="city">
                                    City
                                </label>

                                <input
                                    type="text"
                                    id="city"
                                    required>

                            </div>


                            <div class="form-group">

                                <label for="postal">
                                    Postal Code
                                </label>

                                <input
                                    type="text"
                                    id="postal"
                                    required>

                            </div>

                        </div>

                    </div>



                    <!-- PAYMENT -->

                    <div class="checkout-section">

                        <h2>
                            Payment
                        </h2>


                        <div class="payment-methods">

                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="card"
                                    checked>

                                <span>
                                    Credit / Debit Card
                                </span>

                            </label>


                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="cash">

                                <span>
                                    Cash on Delivery
                                </span>

                            </label>

                        </div>


                        <div
                            id="card-fields"
                            class="card-fields">


                            <div class="form-group">

                                <label for="card-number">
                                    Card Number
                                </label>

                                <input
                                    type="text"
                                    id="card-number"
                                    placeholder="1234 5678 9012 3456"
                                    maxlength="19">

                            </div>


                            <div class="form-row">

                                <div class="form-group">

                                    <label for="expiry">
                                        Expiry Date
                                    </label>

                                    <input
                                        type="text"
                                        id="expiry"
                                        placeholder="MM/YY"
                                        maxlength="5">

                                </div>


                                <div class="form-group">

                                    <label for="cvv">
                                        CVV
                                    </label>

                                    <input
                                        type="password"
                                        id="cvv"
                                        placeholder="123"
                                        maxlength="3">

                                </div>

                            </div>

                        </div>

                    </div>



                    <button
                        type="submit"
                        class="place-order">

                        Place Order

                    </button>


                </form>

            </section>



            <!-- ORDER SUMMARY -->

            <aside class="checkout-summary">

                <h2>
                    Your Order
                </h2>


                <div
                    id="checkout-items"
                    class="checkout-items">
                </div>


                <div class="summary-line">
                </div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span id="checkout-subtotal">
                        $0
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Shipping
                    </span>

                    <span id="checkout-shipping">
                        $0
                    </span>

                </div>


                <div class="summary-line">
                </div>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span id="checkout-total">
                        $0
                    </span>

                </div>

            </aside>

        </div>

    </main>



    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            LUNA
        </div>

        <p>
            Modern essentials, made for you.
        </p>

        <p>
            © 2026 LUNA. All rights reserved.
        </p>

    </footer>



    <script src="js/products.js"></script>

    <script src="js/main.js"></script>

    <script src="js/checkout.js"></script>

</body>

</html>
